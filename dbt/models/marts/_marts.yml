version: 2

models:
  - name: mart_pro_champion_patch
    description: >
      Meta pro par patch et par champion : picks, victoires, bans, taux de
      victoire, taux de pick, taux de ban, presence (pick ou ban). Source :
      Oracle's Elixir ; champion_id : Data Dragon, joint par (nom, patch_key).
    columns:
      - name: champion_id
        description: >
          Vide si le champion n'a pas de ligne Data Dragon pour ce patch.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: presence
        data_tests:
          # Un champion ne peut pas etre a la fois pris et banni dans un meme
          # match : la presence ne peut pas depasser 100 %.
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_name]

  - name: mart_ladder_champion_patch
    description: >
      Meta du ladder EUW par patch, poste et champion : parties, victoires, taux
      de victoire avec sa fourchette (intervalle de Wilson a 95 %), taux de pick.
    columns:
      - name: champion_name
        description: Vide si Data Dragon n'a pas encore ce champion pour ce patch.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: pick_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, team_position, champion_id]
      # La fourchette doit encadrer le taux observe : sinon la macro est fausse.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "win_rate_low <= win_rate AND win_rate <= win_rate_high"

  - name: mart_ladder_matchups
    description: >
      Chaque champion contre son vis-a-vis (meme poste, equipe adverse), par
      patch : taux de victoire avec fourchette, ecarts moyens d'or a 10 et 15
      min, d'XP et de sbires a 10 min. Chaque duel apparait dans les deux sens.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [patch_key, team_position, champion_id, opponent_champion_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "win_rate_low <= win_rate AND win_rate <= win_rate_high"

  - name: mart_ladder_runes
    description: >
      Pages de runes par champion, poste et patch : part des parties du champion,
      taux de victoire avec fourchette.
    columns:
      - name: share_of_champion_games
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [patch_key, team_position, champion_id, keystone_id, primary_style, sub_style]

  - name: mart_ladder_builds
    description: >
      Chemins de build par champion, poste et patch : les deux premiers objets
      termines achetes (ordre tire de la timeline, achats annules exclus), part
      des parties du champion, taux de victoire avec fourchette.
    columns:
      - name: first_item_name
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: share_of_champion_games
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [patch_key, team_position, champion_id, first_item_id, second_item_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "win_rate_low <= win_rate AND win_rate <= win_rate_high"

  - name: mart_meta_diffusion
    description: >
      Grille patch x champion (tous les champions Data Dragon) : taux de pick en
      pro et sur la ladder EUW, appartenance au coeur de la meta (le plus petit
      groupe de champions qui fait la moitie des picks), evolution depuis le
      patch precedent. Taux NULL quand le patch n'est pas couvert par la source.
    columns:
      - name: pro_pick_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: ladder_pick_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id]

  - name: mart_meta_diffusion_lag
    description: >
      Delai de diffusion par champion : premier patch dans le coeur de la meta
      pro, premier patch dans celui de la ladder, ecart en patches (positif :
      le pro d'abord). Pas de delai quand l'entree est censuree (champion deja
      dans la meta au premier patch collecte).
    columns:
      - name: champion_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - hors meta
                  - deja dans la meta au debut de la collecte
                  - ladder seulement
                  - pro seulement (pas encore descendu)
                  - entree pro avant la collecte ladder
                  - mesure
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(status = 'mesure') = (lag_patches IS NOT NULL)"

  - name: mart_kit_value_changes
    description: >
      Chiffres des sorts qui changent d'un patch au suivant (buffs et nerfs),
      avec la variation absolue et relative. source = communitydragon (valeurs
      par rang) ou data_dragon (temps de recharge, cout).
    columns:
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [communitydragon, data_dragon]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [patch_key, source, champion_id, slot, spell_name, value_name, spell_rank]

  - name: mart_kit_part_changes
    description: >
      Morceaux de formule modifies, ajoutes ou retires d'un patch au suivant,
      compares au meme endroit de l'arbre. Seuls les champions presents dans
      les deux patches sont compares.
    columns:
      - name: change_kind
        data_tests:
          - accepted_values:
              arguments:
                values: [ajoute, retire, modifie, renomme]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, slot, calc_name, part_path]

  - name: mart_champion_stat_profile
    description: >
      Profil de sensibilite de chaque champion par patch : somme de ses ratios
      par stat (formules Tooltip et ratios sous 0,01 ecartes, ratios par rang au
      rang max). Version A du moteur theorique.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, stat_label]

  - name: mart_item_theory_value
    description: >
      Valeur theorique de chaque objet termine pour chaque champion par patch :
      stats de l'objet x profil du champion, pour 1 000 pieces d'or, rang de
      l'objet pour le champion, ecart avec le patch precedent. Approximation
      (passifs des objets ignores).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, item_id]

unit_tests:
  # Le calcul de la fourchette, fige sur un cas verifie a la main : Ahri mid,
  # 3 victoires sur 4 -> Wilson 95 % = [0,3006 ; 0,9544].
  - name: wilson_interval_on_three_wins_out_of_four
    model: mart_ladder_champion_patch
    given:
      - input: ref('stg_ladder__participants')
        rows:
          - {match_id: "EUW1_1", patch_key: 1621, team_position: MIDDLE, champion_id: 103, is_win: true}
          - {match_id: "EUW1_2", patch_key: 1621, team_position: MIDDLE, champion_id: 103, is_win: true}
          - {match_id: "EUW1_3", patch_key: 1621, team_position: MIDDLE, champion_id: 103, is_win: true}
          - {match_id: "EUW1_4", patch_key: 1621, team_position: MIDDLE, champion_id: 103, is_win: false}
      - input: ref('stg_ddragon__champions')
        rows:
          - {patch_key: 1621, champion_id: 103, champion_name: Ahri}
    expect:
      rows:
        - {patch_key: 1621, team_position: MIDDLE, champion_id: 103, champion_name: Ahri,
           matches: 4, games: 4, wins: 3, win_rate: 0.75,
           win_rate_low: 0.3006, win_rate_high: 0.9544, pick_rate: 1.0}

  # L'ordre du build et l'achat annule : Jinx achete la Lame d'infini (3031),
  # l'annule 10 s plus tard, achete Collector (6676), puis rachete la Lame.
  # Le chemin doit etre Collector puis Lame, pas Lame puis Collector.
  - name: build_path_ignores_an_undone_purchase
    model: mart_ladder_builds
    given:
      - input: ref('stg_ladder__participants')
        rows:
          - {match_id: "EUW1_1", participant_id: 4, patch_key: 1621,
             team_position: BOTTOM, champion_id: 222, is_win: true}
      - input: ref('stg_ddragon__items')
        rows:
          - {patch_key: 1621, item_id: 3031, item_name: "Infinity Edge", is_completed: true}
          - {patch_key: 1621, item_id: 6676, item_name: "The Collector", is_completed: true}
          - {patch_key: 1621, item_id: 1038, item_name: "B. F. Sword", is_completed: false}
      - input: ref('stg_ladder__events')
        rows:
          - {match_id: "EUW1_1", participant_id: 4, event_type: ITEM_PURCHASED,
             item_id: 1038, before_item_id: null, timestamp_ms: 400000}
          - {match_id: "EUW1_1", participant_id: 4, event_type: ITEM_PURCHASED,
             item_id: 3031, before_item_id: null, timestamp_ms: 600000}
          - {match_id: "EUW1_1", participant_id: 4, event_type: ITEM_UNDO,
             item_id: null, before_item_id: 3031, timestamp_ms: 610000}
          - {match_id: "EUW1_1", participant_id: 4, event_type: ITEM_PURCHASED,
             item_id: 6676, before_item_id: null, timestamp_ms: 900000}
          - {match_id: "EUW1_1", participant_id: 4, event_type: ITEM_PURCHASED,
             item_id: 3031, before_item_id: null, timestamp_ms: 1300000}
    expect:
      rows:
        - {patch_key: 1621, team_position: BOTTOM, champion_id: 222,
           first_item_id: 6676, first_item_name: "The Collector",
           second_item_id: 3031, second_item_name: "Infinity Edge",
           games: 1, wins: 1, share_of_champion_games: 1.0, win_rate: 1.0}

  # Les cinq statuts du delai de diffusion. Pro collecte des le patch 1,
  # ladder seulement depuis le patch 3 :
  #   Teemo    jamais dans un coeur -> hors meta
  #   Vi       coeur pro au patch 4, coeur ladder au patch 5 -> mesure, 1 patch
  #   Ahri     coeur ladder des le patch 3, le premier collecte -> censure
  #   Nocturne coeur pro au patch 4, jamais en ladder -> pro seulement
  #   Jinx     coeur pro au patch 2, avant la collecte ladder -> non mesurable
  - name: diffusion_lag_statuses_and_left_censoring
    model: mart_meta_diffusion_lag
    given:
      - input: ref('mart_meta_diffusion')
        rows:
          - {patch_key: 1617, patch_index: 1, champion_id: 17, champion_name: Teemo,
             pro_matches: 100, ladder_matches: null, in_pro_core: false, in_ladder_core: null}
          - {patch_key: 1619, patch_index: 3, champion_id: 17, champion_name: Teemo,
             pro_matches: 100, ladder_matches: 1000, in_pro_core: false, in_ladder_core: false}
          - {patch_key: 1620, patch_index: 4, champion_id: 254, champion_name: Vi,
             pro_matches: 100, ladder_matches: 1000, in_pro_core: true, in_ladder_core: false}
          - {patch_key: 1621, patch_index: 5, champion_id: 254, champion_name: Vi,
             pro_matches: 100, ladder_matches: 1000, in_pro_core: true, in_ladder_core: true}
          - {patch_key: 1619, patch_index: 3, champion_id: 103, champion_name: Ahri,
             pro_matches: 100, ladder_matches: 1000, in_pro_core: false, in_ladder_core: true}
          - {patch_key: 1620, patch_index: 4, champion_id: 56, champion_name: Nocturne,
             pro_matches: 100, ladder_matches: 1000, in_pro_core: true, in_ladder_core: false}
          - {patch_key: 1618, patch_index: 2, champion_id: 222, champion_name: Jinx,
             pro_matches: 100, ladder_matches: null, in_pro_core: true, in_ladder_core: null}
    expect:
      rows:
        - {champion_id: 17, status: "hors meta", lag_patches: null}
        - {champion_id: 254, status: "mesure", lag_patches: 1}
        - {champion_id: 103, status: "deja dans la meta au debut de la collecte", lag_patches: null}
        - {champion_id: 56, status: "pro seulement (pas encore descendu)", lag_patches: null}
        - {champion_id: 222, status: "entree pro avant la collecte ladder", lag_patches: null}

  # Deux patches. Ambessa (799) :
  #   bouclier W, ratio AD bonus 1,5 -> 1,8           -> modifie
  #   un ratio de PV bonus apparait au 2e patch       -> ajoute
  #   un nombre fixe disparait au 2e patch            -> retire
  #   la partie selon le niveau ne bouge pas          -> absente du resultat
  # Un champion qui sort au 2e patch (950)            -> rien
  - name: kit_part_changes_detects_modified_added_and_removed_pieces
    model: mart_kit_part_changes
    given:
      - input: ref('stg_kit__parts')
        rows:
          - {patch_key: 1621, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.0", part_type: ByCharLevelInterpolationCalculationPart,
             start_value: 50.0, end_value: 320.0}
          - {patch_key: 1621, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.1", part_type: StatByCoefficientCalculationPart,
             stat: 2, stat_formula: 2, coefficient: 1.5}
          - {patch_key: 1621, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.2", part_type: NumberCalculationPart, number: 10.0}
          - {patch_key: 1622, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.0", part_type: ByCharLevelInterpolationCalculationPart,
             start_value: 50.0, end_value: 320.0}
          - {patch_key: 1622, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.1", part_type: StatByCoefficientCalculationPart,
             stat: 2, stat_formula: 2, coefficient: 1.8}
          - {patch_key: 1622, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.3", part_type: StatByCoefficientCalculationPart,
             stat: 12, stat_formula: 2, coefficient: 0.04}
          - {patch_key: 1622, champion_id: 950, slot: Q, calc_name: Calc_Damage,
             part_path: "mFormulaParts.0", part_type: NumberCalculationPart, number: 5.0}
      - input: ref('stg_kit__formulas')
        rows:
          - {patch_key: 1621, champion_id: 799, slot: W, calc_name: Calc_Shield, formula: "avant"}
          - {patch_key: 1622, champion_id: 799, slot: W, calc_name: Calc_Shield, formula: "apres"}
          - {patch_key: 1622, champion_id: 950, slot: Q, calc_name: Calc_Damage, formula: "neuf"}
      - input: ref('stg_ddragon__champions')
        rows:
          - {patch_key: 1622, champion_id: 799, champion_name: Ambessa}
    expect:
      rows:
        - {patch_key: 1622, previous_patch_key: 1621, champion_id: 799, champion_name: Ambessa,
           part_path: "mFormulaParts.1", change_kind: modifie,
           old_coefficient: 1.5, new_coefficient: 1.8}
        - {patch_key: 1622, previous_patch_key: 1621, champion_id: 799, champion_name: Ambessa,
           part_path: "mFormulaParts.3", change_kind: ajoute,
           old_coefficient: null, new_coefficient: 0.04}
        - {patch_key: 1622, previous_patch_key: 1621, champion_id: 799, champion_name: Ambessa,
           part_path: "mFormulaParts.2", change_kind: retire,
           old_coefficient: null, new_coefficient: null}

  # Orianna 16.22 : TotalDamageTooltip devient TotalDamage, au contenu identique
  # (meme empreinte md5, verifie le 04/11). Un renommage dans les fichiers, pas
  # un changement de jeu : tous les morceaux, des deux cotes, sont "renomme".
  - name: kit_part_changes_recognizes_a_renamed_formula
    model: mart_kit_part_changes
    given:
      - input: ref('stg_kit__parts')
        rows:
          - {patch_key: 1621, champion_id: 61, champion_code: Orianna, slot: Q,
             calc_name: TotalDamageTooltip, part_path: "mFormulaParts.0",
             part_type: NamedDataValueCalculationPart, data_value: BaseDamage}
          - {patch_key: 1621, champion_id: 61, champion_code: Orianna, slot: Q,
             calc_name: TotalDamageTooltip, part_path: "mFormulaParts.1",
             part_type: StatByCoefficientCalculationPart, stat: 0, stat_formula: 0, coefficient: 0.55}
          - {patch_key: 1622, champion_id: 61, champion_code: Orianna, slot: Q,
             calc_name: TotalDamage, part_path: "mFormulaParts.0",
             part_type: NamedDataValueCalculationPart, data_value: BaseDamage}
          - {patch_key: 1622, champion_id: 61, champion_code: Orianna, slot: Q,
             calc_name: TotalDamage, part_path: "mFormulaParts.1",
             part_type: StatByCoefficientCalculationPart, stat: 0, stat_formula: 0, coefficient: 0.55}
      - input: ref('stg_kit__formulas')
        rows:
          - {patch_key: 1621, champion_id: 61, slot: Q, calc_name: TotalDamageTooltip, formula: "meme contenu"}
          - {patch_key: 1622, champion_id: 61, slot: Q, calc_name: TotalDamage, formula: "meme contenu"}
      - input: ref('stg_ddragon__champions')
        rows: []
    expect:
      rows:
        - {calc_name: TotalDamageTooltip, part_path: "mFormulaParts.0", change_kind: renomme,
           renamed_counterpart: TotalDamage}
        - {calc_name: TotalDamageTooltip, part_path: "mFormulaParts.1", change_kind: renomme,
           renamed_counterpart: TotalDamage}
        - {calc_name: TotalDamage, part_path: "mFormulaParts.0", change_kind: renomme,
           renamed_counterpart: TotalDamageTooltip}
        - {calc_name: TotalDamage, part_path: "mFormulaParts.1", change_kind: renomme,
           renamed_counterpart: TotalDamageTooltip}

  # Un champion dont les ratios d'attaque bonus font 1,5 + 0,2, et le Couperet
  # noir (45 d'attaque, 400 PV, 3 000 po) : 1,7 x 45 = 76,5, soit 25,5 pour
  # 1 000 po. Les PV ne comptent pas : le profil n'en a pas.
  - name: item_theory_value_multiplies_item_stats_by_the_profile
    model: mart_item_theory_value
    given:
      - input: ref('mart_champion_stat_profile')
        rows:
          - {patch_key: 1622, champion_id: 799, champion_code: Ambessa,
             stat_label: attaque bonus, item_stat: FlatPhysicalDamageMod, total_coefficient: 1.7}
      - input: ref('stg_ddragon__items')
        rows:
          - {patch_key: 1622, item_id: 3071, item_name: Black Cleaver, gold_total: 3000, is_completed: true}
      - input: ref('stg_item_stats')
        rows:
          - {patch_key: 1622, item_id: 3071, stat: FlatPhysicalDamageMod, value: 45.0}
          - {patch_key: 1622, item_id: 3071, stat: FlatHPPoolMod, value: 400.0}
          - {patch_key: 1622, item_id: 3071, stat: AbilityHasteMod, value: 20.0}
    expect:
      rows:
        - {patch_key: 1622, champion_id: 799, item_id: 3071, theory_value: 76.5,
           theory_value_per_1000_gold: 25.5, rank_for_champion: 1}
