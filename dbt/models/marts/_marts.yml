version: 2

models:
  - name: mart_pro_champion_patch
    description: >
      Meta pro par patch et par champion : picks, victoires, bans, taux de
      victoire, taux de pick, taux de ban, presence (pick ou ban). Source :
      Oracle's Elixir ; champion_id : Data Dragon, joint par (nom, patch_key).
    columns:
      - name: champion_id
        description: >
          Vide si le champion n'a pas de ligne Data Dragon pour ce patch.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: presence
        data_tests:
          # Un champion ne peut pas etre a la fois pris et banni dans un meme
          # match : la presence ne peut pas depasser 100 %.
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_name]

  - name: mart_ladder_champion_patch
    description: >
      Meta du ladder EUW par patch, poste et champion : parties, victoires, taux
      de victoire avec sa fourchette (intervalle de Wilson a 95 %), taux de pick.
    columns:
      - name: champion_name
        description: Vide si Data Dragon n'a pas encore ce champion pour ce patch.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: pick_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, team_position, champion_id]
      # La fourchette doit encadrer le taux observe : sinon la macro est fausse.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "win_rate_low <= win_rate AND win_rate <= win_rate_high"

  - name: mart_ladder_matchups
    description: >
      Chaque champion contre son vis-a-vis (meme poste, equipe adverse), par
      patch : taux de victoire avec fourchette, ecarts moyens d'or a 10 et 15
      min, d'XP et de sbires a 10 min. Chaque duel apparait dans les deux sens.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [patch_key, team_position, champion_id, opponent_champion_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "win_rate_low <= win_rate AND win_rate <= win_rate_high"

  - name: mart_ladder_runes
    description: >
      Pages de runes par champion, poste et patch : part des parties du champion,
      taux de victoire avec fourchette.
    columns:
      - name: share_of_champion_games
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [patch_key, team_position, champion_id, keystone_id, primary_style, sub_style]

  - name: mart_ladder_builds
    description: >
      Chemins de build par champion, poste et patch : les deux premiers objets
      termines achetes (ordre tire de la timeline, achats annules exclus), part
      des parties du champion, taux de victoire avec fourchette.
    columns:
      - name: first_item_name
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: share_of_champion_games
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [patch_key, team_position, champion_id, first_item_id, second_item_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "win_rate_low <= win_rate AND win_rate <= win_rate_high"

  - name: mart_ladder_build_families
    description: >
      Les familles de builds du ladder : pour chaque champion a son poste et par
      patch, combien de parties dans chaque famille (critique, letalite, on-hit,
      AP, hybride...), le taux de victoire et sa fourchette de Wilson. Une
      famille est un CHOIX a partir de build_family_min_games parties (decision
      de William du 05/11/2026) ; les choix sont classes par le bas de la
      fourchette, pas par le taux brut. Le nombre de choix d'un champion sort
      des donnees (decision du 05/11 : 2-3 en general, plus pour les
      polyvalents). games_with_three_items dit combien de builds etaient
      complets (les autres sont classes sur 1 ou 2 objets).
    columns:
      - name: build_family
        data_tests:
          - accepted_values:
              arguments:
                values: [critique, letalite, on_hit, ap, combattant, tank,
                         enchanteur, support, ad_mana, hybride, sans_famille]
      - name: share_of_champion_games
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, team_position, champion_id, build_family]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "win_rate_low <= win_rate AND win_rate <= win_rate_high"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(is_choice AND choice_rank IS NOT NULL) OR (NOT is_choice AND choice_rank IS NULL)"

  - name: mart_ladder_build_fidelity
    description: >
      Bulletin de patch, mesure 1 : la fidelite des builds. Une ligne par
      patch. Les 3 premiers objets termines de chaque joueur (ceux des marts de
      builds et de familles) sont compares a son inventaire de fin de partie,
      une autre source de Riot. items_transformed = objets retrouves sous leur
      forme transformee (Manamune -> Muramana, seed item_transformations).
      fidelity_rate = (trouves + transformes) / controles. most_missing_items
      = les 3 objets les plus souvent absents, pour diagnostiquer une alerte.
      Mesure du 06/11/2026 : 99,84 % au 16.21, 99,79 % au 16.22.
    columns:
      - name: patch_key
        data_tests: [unique, not_null]
      - name: fidelity_rate
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "items_found + items_transformed + items_missing = items_checked"

  - name: mart_ladder_build_duels
    description: >
      Bulletin de patch, mesure 2 : pour chaque champion a son poste, le build
      le plus joue contre la meilleure alternative, au niveau de la famille
      (critique, letalite...) et du chemin (deux premiers objets). Seules les
      options jouees au moins build_family_min_games fois comptent ; un
      champion a une seule option n'a pas de ligne. verdict compare les
      fourchettes de Wilson : populaire_confirme (le bas du populaire depasse
      le haut de toutes les alternatives), pepite (le bas de la challengeuse
      depasse le haut du populaire), non_departage (chevauchement : pas assez
      de parties pour trancher).
    columns:
      - name: level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [famille, chemin]
      - name: verdict
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [populaire_confirme, pepite, non_departage]
      - name: options
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, team_position, champion_id, level]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "popular_games >= challenger_games"

  - name: mart_patch_predictions
    description: >
      Bulletin de patch, mesure 3 (1/2) : ce que le moteur theorique predit a
      chaque patch, avant toute partie. Une ligne par patch et par sujet qui
      change : un objet modifie par Riot (stats ou prix), ou un champion dont
      les ratios du kit ont change. predicted_direction = hausse ou baisse de
      la valeur theorique (pour 1 000 pieces d'or) ; theory_change_pct = son
      ecart moyen en %. Les deux causes sont separees : un champion dont le
      kit a change est ecarte des concernes d'un objet change.
      concerned_champion_ids = les champions pour qui l'objet change de valeur
      (pour un champion : lui-meme). value_kind (19/11/2026) = la valeur qui
      porte la prediction : degats, ou survie pour un champion dont seuls les
      boucliers, soins ou vitesses changent ; toujours degats pour un objet.
    columns:
      - name: value_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [degats, survie]
      - name: subject_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [objet, champion]
      - name: predicted_direction
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hausse, baisse]
      - name: subject_name
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, subject_type, subject_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "concerned_champions >= 1"

  - name: mart_patch_experiments
    description: >
      Bulletin de patch, mesure 3 (2/2) : les predictions du moteur theorique
      confrontees au ladder, ancien patch contre nouveau. Une ligne par
      prediction testable (les deux patches ont des parties). share = part
      des joueurs concernes qui achetent l'objet (3 premiers objets termines)
      ou part des joueurs qui jouent le champion ; win_rate = taux de victoire
      quand l'objet est achete, ou du champion. share_verdict et win_verdict
      (macro patch_verdict) : confirme, meme_sens, sens_contraire, contredit,
      stable, sans_donnees ; « confirme » et « contredit » exigent des
      fourchettes de Wilson separees. value_kind = la valeur qui portait la
      prediction (degats ou survie).
    columns:
      - name: share_verdict
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [confirme, meme_sens, sens_contraire, contredit, stable, sans_donnees]
      - name: win_verdict
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [confirme, meme_sens, sens_contraire, contredit, stable, sans_donnees]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, subject_type, subject_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "old_hits <= old_population AND new_hits <= new_population"

  - name: mart_item_gold_value
    description: >
      Moteur theorique version B (dev seulement tant que le seed n'est pas
      relu) : la valeur de chaque objet termine pour chaque champion, en or
      utile. useful_gold_value = somme des stats x prix d'un point x utilite
      de la stat pour le champion (classe principale, moitie de la classe
      secondaire, ou part du ratio du kit). useful_gold_efficiency = valeur
      utile / prix (1,00 = rentable comme ses composants de base).
      gold_efficiency = la meme chose sans le filtre d'utilite.
    columns:
      - name: useful_gold_efficiency
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, item_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "useful_gold_value <= gold_value"

  - name: mart_patch_bulletin
    description: >
      Le bulletin de patch : une ligne par patch du ladder, qui resume les
      trois mesures. Fidelite des builds (mart_ladder_build_fidelity) ; duels
      populaire contre alternative, confirmes et pepites, par famille et par
      chemin (mart_ladder_build_duels) ; experiences de patch : combien dans
      le sens predit par le moteur theorique (confirme ou meme_sens), combien
      prouvees, combien contredites (mart_patch_experiments, verdict sur la
      part d'achat ou de jeu).
    columns:
      - name: patch_key
        data_tests: [unique, not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "family_confirmed + family_gems <= family_duels AND path_confirmed + path_gems <= path_duels AND experiments_predicted_direction <= experiments"

  - name: mart_meta_diffusion
    description: >
      Grille patch x champion (tous les champions Data Dragon) : taux de pick en
      pro et sur la ladder EUW, appartenance au coeur de la meta (le plus petit
      groupe de champions qui fait la moitie des picks), evolution depuis le
      patch precedent. Taux NULL quand le patch n'est pas couvert par la source.
    columns:
      - name: pro_pick_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: ladder_pick_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id]

  - name: mart_meta_diffusion_lag
    description: >
      Delai de diffusion par champion : premier patch dans le coeur de la meta
      pro, premier patch dans celui de la ladder, ecart en patches (positif :
      le pro d'abord). Pas de delai quand l'entree est censuree (champion deja
      dans la meta au premier patch collecte).
    columns:
      - name: champion_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - hors meta
                  - deja dans la meta au debut de la collecte
                  - ladder seulement
                  - pro seulement (pas encore descendu)
                  - entree pro avant la collecte ladder
                  - mesure
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(status = 'mesure') = (lag_patches IS NOT NULL)"

  - name: mart_kit_value_changes
    description: >
      Chiffres des sorts qui changent d'un patch au suivant (buffs et nerfs),
      avec la variation absolue et relative. source = communitydragon (valeurs
      par rang) ou data_dragon (temps de recharge, cout).
    columns:
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [communitydragon, data_dragon]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [patch_key, source, champion_id, slot, spell_name, value_name, spell_rank]

  - name: mart_kit_part_changes
    description: >
      Morceaux de formule modifies, ajoutes ou retires d'un patch au suivant,
      compares au meme endroit de l'arbre. Seuls les champions presents dans
      les deux patches sont compares.
    columns:
      - name: change_kind
        data_tests:
          - accepted_values:
              arguments:
                values: [ajoute, retire, modifie, renomme]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, slot, calc_name, part_path]

  - name: mart_champion_stat_profile
    description: >
      Profil de sensibilite de chaque champion par patch : somme de ses ratios
      par stat (ratios identiques d'un meme sort comptes une fois, ratios sous
      0,01 ecartes, ratios par rang au rang max). Version A du moteur
      theorique. Deux profils par champion (19/11/2026) : value_kind =
      degats, ou survie (formules que l'infobulle designe clairement comme
      bouclier, soin ou vitesse, et jamais comme degats).
    columns:
      - name: value_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [degats, survie]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, value_kind, stat_label]

  - name: mart_item_theory_value
    description: >
      Valeur theorique de chaque objet termine pour chaque champion par patch :
      stats de l'objet x profil du champion, pour 1 000 pieces d'or, rang de
      l'objet pour le champion, ecart avec le patch precedent. Approximation
      (passifs des objets ignores). Deux valeurs jamais additionnees
      (19/11/2026) : value_kind = degats ou survie, chacune avec son rang et
      son ecart.
    columns:
      - name: value_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [degats, survie]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, value_kind, item_id]

unit_tests:
  # Le calcul de la fourchette, fige sur un cas verifie a la main : Ahri mid,
  # 3 victoires sur 4 -> Wilson 95 % = [0,3006 ; 0,9544].
  - name: wilson_interval_on_three_wins_out_of_four
    model: mart_ladder_champion_patch
    given:
      - input: ref('stg_ladder__participants')
        rows:
          - {match_id: "EUW1_1", patch_key: 1621, team_position: MIDDLE, champion_id: 103, is_win: true}
          - {match_id: "EUW1_2", patch_key: 1621, team_position: MIDDLE, champion_id: 103, is_win: true}
          - {match_id: "EUW1_3", patch_key: 1621, team_position: MIDDLE, champion_id: 103, is_win: true}
          - {match_id: "EUW1_4", patch_key: 1621, team_position: MIDDLE, champion_id: 103, is_win: false}
      - input: ref('stg_ddragon__champions')
        rows:
          - {patch_key: 1621, champion_id: 103, champion_name: Ahri}
    expect:
      rows:
        - {patch_key: 1621, team_position: MIDDLE, champion_id: 103, champion_name: Ahri,
           matches: 4, games: 4, wins: 3, win_rate: 0.75,
           win_rate_low: 0.3006, win_rate_high: 0.9544, pick_rate: 1.0}

  # Le chemin de build = les deux premiers objets de l'ordre d'achat (la regle
  # des achats annules est testee dans int_ladder__completed_purchases depuis
  # le 06/11/2026). Jinx : Collector (rang 1) puis Lame d'infini (rang 2) ; le
  # 3e objet n'entre pas dans le chemin.
  - name: build_path_takes_the_first_two_purchases
    model: mart_ladder_builds
    given:
      - input: ref('stg_ladder__participants')
        rows:
          - {match_id: "EUW1_1", participant_id: 4, patch_key: 1621,
             team_position: BOTTOM, champion_id: 222, is_win: true}
      - input: ref('stg_ddragon__items')
        rows:
          - {patch_key: 1621, item_id: 3031, item_name: "Infinity Edge", is_completed: true}
          - {patch_key: 1621, item_id: 6676, item_name: "The Collector", is_completed: true}
          - {patch_key: 1621, item_id: 6672, item_name: "Kraken Slayer", is_completed: true}
      - input: ref('int_ladder__completed_purchases')
        rows:
          - {match_id: "EUW1_1", participant_id: 4, item_id: 6676, purchase_rank: 1}
          - {match_id: "EUW1_1", participant_id: 4, item_id: 3031, purchase_rank: 2}
          - {match_id: "EUW1_1", participant_id: 4, item_id: 6672, purchase_rank: 3}
    expect:
      rows:
        - {patch_key: 1621, team_position: BOTTOM, champion_id: 222,
           first_item_id: 6676, first_item_name: "The Collector",
           second_item_id: 3031, second_item_name: "Infinity Edge",
           games: 1, wins: 1, share_of_champion_games: 1.0, win_rate: 1.0}

  # Les familles de builds d'un champion, seuil de choix abaisse a 2 parties
  # pour le test : Jinx critique 3 parties (2 victoires), on-hit 1 partie.
  # Critique est un choix (rang 1), on-hit non (sous le seuil) ; part des
  # parties 0,75 / 0,25 ; un seul choix pour Jinx.
  - name: build_families_choice_threshold_and_rank
    model: mart_ladder_build_families
    overrides:
      vars:
        build_family_min_games: 2
    given:
      - input: ref('int_ladder__build_families')
        rows:
          - {patch_key: 1622, team_position: BOTTOM, champion_id: 222, match_id: "M1", participant_id: 1, is_win: true, build_family: critique, items_counted: 3}
          - {patch_key: 1622, team_position: BOTTOM, champion_id: 222, match_id: "M2", participant_id: 1, is_win: true, build_family: critique, items_counted: 2}
          - {patch_key: 1622, team_position: BOTTOM, champion_id: 222, match_id: "M3", participant_id: 1, is_win: false, build_family: critique, items_counted: 3}
          - {patch_key: 1622, team_position: BOTTOM, champion_id: 222, match_id: "M4", participant_id: 1, is_win: true, build_family: on_hit, items_counted: 3}
      - input: ref('stg_ddragon__champions')
        rows:
          - {patch_key: 1622, champion_id: 222, champion_name: Jinx}
    expect:
      rows:
        - {build_family: critique, champion_name: Jinx, games: 3, wins: 2, games_with_three_items: 2,
           share_of_champion_games: 0.75, is_choice: true, choice_rank: 1, choices_for_champion: 1}
        - {build_family: on_hit, champion_name: Jinx, games: 1, wins: 1, games_with_three_items: 1,
           share_of_champion_games: 0.25, is_choice: false, choice_rank: null, choices_for_champion: 1}

  # Les cinq statuts du delai de diffusion. Pro collecte des le patch 1,
  # ladder seulement depuis le patch 3 :
  #   Teemo    jamais dans un coeur -> hors meta
  #   Vi       coeur pro au patch 4, coeur ladder au patch 5 -> mesure, 1 patch
  #   Ahri     coeur ladder des le patch 3, le premier collecte -> censure
  #   Nocturne coeur pro au patch 4, jamais en ladder -> pro seulement
  #   Jinx     coeur pro au patch 2, avant la collecte ladder -> non mesurable
  - name: diffusion_lag_statuses_and_left_censoring
    model: mart_meta_diffusion_lag
    given:
      - input: ref('mart_meta_diffusion')
        rows:
          - {patch_key: 1617, patch_index: 1, champion_id: 17, champion_name: Teemo,
             pro_matches: 100, ladder_matches: null, in_pro_core: false, in_ladder_core: null}
          - {patch_key: 1619, patch_index: 3, champion_id: 17, champion_name: Teemo,
             pro_matches: 100, ladder_matches: 1000, in_pro_core: false, in_ladder_core: false}
          - {patch_key: 1620, patch_index: 4, champion_id: 254, champion_name: Vi,
             pro_matches: 100, ladder_matches: 1000, in_pro_core: true, in_ladder_core: false}
          - {patch_key: 1621, patch_index: 5, champion_id: 254, champion_name: Vi,
             pro_matches: 100, ladder_matches: 1000, in_pro_core: true, in_ladder_core: true}
          - {patch_key: 1619, patch_index: 3, champion_id: 103, champion_name: Ahri,
             pro_matches: 100, ladder_matches: 1000, in_pro_core: false, in_ladder_core: true}
          - {patch_key: 1620, patch_index: 4, champion_id: 56, champion_name: Nocturne,
             pro_matches: 100, ladder_matches: 1000, in_pro_core: true, in_ladder_core: false}
          - {patch_key: 1618, patch_index: 2, champion_id: 222, champion_name: Jinx,
             pro_matches: 100, ladder_matches: null, in_pro_core: true, in_ladder_core: null}
    expect:
      rows:
        - {champion_id: 17, status: "hors meta", lag_patches: null}
        - {champion_id: 254, status: "mesure", lag_patches: 1}
        - {champion_id: 103, status: "deja dans la meta au debut de la collecte", lag_patches: null}
        - {champion_id: 56, status: "pro seulement (pas encore descendu)", lag_patches: null}
        - {champion_id: 222, status: "entree pro avant la collecte ladder", lag_patches: null}

  # Deux patches. Ambessa (799) :
  #   bouclier W, ratio AD bonus 1,5 -> 1,8           -> modifie
  #   un ratio de PV bonus apparait au 2e patch       -> ajoute
  #   un nombre fixe disparait au 2e patch            -> retire
  #   la partie selon le niveau ne bouge pas          -> absente du resultat
  # Un champion qui sort au 2e patch (950)            -> rien
  - name: kit_part_changes_detects_modified_added_and_removed_pieces
    model: mart_kit_part_changes
    given:
      - input: ref('stg_kit__parts')
        rows:
          - {patch_key: 1621, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.0", part_type: ByCharLevelInterpolationCalculationPart,
             start_value: 50.0, end_value: 320.0}
          - {patch_key: 1621, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.1", part_type: StatByCoefficientCalculationPart,
             stat: 2, stat_formula: 2, coefficient: 1.5}
          - {patch_key: 1621, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.2", part_type: NumberCalculationPart, number: 10.0}
          - {patch_key: 1622, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.0", part_type: ByCharLevelInterpolationCalculationPart,
             start_value: 50.0, end_value: 320.0}
          - {patch_key: 1622, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.1", part_type: StatByCoefficientCalculationPart,
             stat: 2, stat_formula: 2, coefficient: 1.8}
          - {patch_key: 1622, champion_id: 799, slot: W, calc_name: Calc_Shield,
             part_path: "mFormulaParts.3", part_type: StatByCoefficientCalculationPart,
             stat: 12, stat_formula: 2, coefficient: 0.04}
          - {patch_key: 1622, champion_id: 950, slot: Q, calc_name: Calc_Damage,
             part_path: "mFormulaParts.0", part_type: NumberCalculationPart, number: 5.0}
      - input: ref('stg_kit__formulas')
        rows:
          - {patch_key: 1621, champion_id: 799, slot: W, calc_name: Calc_Shield, formula: "avant"}
          - {patch_key: 1622, champion_id: 799, slot: W, calc_name: Calc_Shield, formula: "apres"}
          - {patch_key: 1622, champion_id: 950, slot: Q, calc_name: Calc_Damage, formula: "neuf"}
      - input: ref('stg_ddragon__champions')
        rows:
          - {patch_key: 1622, champion_id: 799, champion_name: Ambessa}
    expect:
      rows:
        - {patch_key: 1622, previous_patch_key: 1621, champion_id: 799, champion_name: Ambessa,
           part_path: "mFormulaParts.1", change_kind: modifie,
           old_coefficient: 1.5, new_coefficient: 1.8}
        - {patch_key: 1622, previous_patch_key: 1621, champion_id: 799, champion_name: Ambessa,
           part_path: "mFormulaParts.3", change_kind: ajoute,
           old_coefficient: null, new_coefficient: 0.04}
        - {patch_key: 1622, previous_patch_key: 1621, champion_id: 799, champion_name: Ambessa,
           part_path: "mFormulaParts.2", change_kind: retire,
           old_coefficient: null, new_coefficient: null}

  # Orianna 16.22 : TotalDamageTooltip devient TotalDamage, au contenu identique
  # (meme empreinte md5, verifie le 04/11). Un renommage dans les fichiers, pas
  # un changement de jeu : tous les morceaux, des deux cotes, sont "renomme".
  - name: kit_part_changes_recognizes_a_renamed_formula
    model: mart_kit_part_changes
    given:
      - input: ref('stg_kit__parts')
        rows:
          - {patch_key: 1621, champion_id: 61, champion_code: Orianna, slot: Q,
             calc_name: TotalDamageTooltip, part_path: "mFormulaParts.0",
             part_type: NamedDataValueCalculationPart, data_value: BaseDamage}
          - {patch_key: 1621, champion_id: 61, champion_code: Orianna, slot: Q,
             calc_name: TotalDamageTooltip, part_path: "mFormulaParts.1",
             part_type: StatByCoefficientCalculationPart, stat: 0, stat_formula: 0, coefficient: 0.55}
          - {patch_key: 1622, champion_id: 61, champion_code: Orianna, slot: Q,
             calc_name: TotalDamage, part_path: "mFormulaParts.0",
             part_type: NamedDataValueCalculationPart, data_value: BaseDamage}
          - {patch_key: 1622, champion_id: 61, champion_code: Orianna, slot: Q,
             calc_name: TotalDamage, part_path: "mFormulaParts.1",
             part_type: StatByCoefficientCalculationPart, stat: 0, stat_formula: 0, coefficient: 0.55}
      - input: ref('stg_kit__formulas')
        rows:
          - {patch_key: 1621, champion_id: 61, slot: Q, calc_name: TotalDamageTooltip, formula: "meme contenu"}
