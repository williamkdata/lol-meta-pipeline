      rows:
        # Degats : Q 0,75 + attaque de Tibbers 0,15 + drain 0,3 ; la formule
        # sans infobulle (0,5 d'attaque) reste comptee.
        - {patch_key: 1623, champion_id: 1, champion_code: Annie, value_kind: degats,
           stat_label: AP totale, ratios: 3, total_coefficient: 1.2}
        - {patch_key: 1623, champion_id: 1, champion_code: Annie, value_kind: degats,
           stat_label: attaque totale, ratios: 1, total_coefficient: 0.5}
        # Survie : bouclier 0,4 + vitesse 0,2 ; les PV de Tibbers 1,5.
