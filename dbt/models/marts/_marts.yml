  # Les experiences de patch, 16.21 -> 16.22. Deux predictions testables et
  # une sans donnees de ladder :
  #   - objet Bloodmail (hausse), concerne : Aatrox (266). Au 16.21, 10
  #     joueurs d'Aatrox, aucun ne l'achete dans ses 3 premiers objets (un
  #     l'achete en 4e : ne compte pas). Au 16.22, 10 joueurs, tous l'achetent
  #     en 1er, 6 gagnent. Part 0/10 [0 ; 0,28] -> 10/10 [0,72 ; 1] :
  #     confirme. Victoires quand achete : aucun acheteur au 16.21 ->
  #     sans_donnees ;
  #   - champion Aurelion Sol (hausse) : joue 2 fois sur 12 joueurs au 16.21
  #     (1 victoire), 1 fois sur 11 au 16.22 (1 victoire). Part en baisse,
  #     fourchettes qui se chevauchent -> sens_contraire ; victoires 1/2 ->
  #     1/1, en hausse sans preuve -> meme_sens ;
  #   - champion 999 au 16.01 : pas de ladder -> pas de ligne.
  - name: patch_experiments_verdicts_against_the_ladder
    model: mart_patch_experiments
    given:
      - input: ref('mart_patch_predictions')
        format: sql
        rows: |
          SELECT 1622 AS patch_key, 1621 AS previous_patch_key, 'objet' AS subject_type,
            2501 AS subject_id, "Overlord's Bloodmail" AS subject_name,
            'hausse' AS predicted_direction, 30.0 AS theory_change_pct,
            1 AS concerned_champions, [266] AS concerned_champion_ids, 'degats' AS value_kind
          UNION ALL SELECT 1622, 1621, 'champion', 136, 'Aurelion Sol', 'hausse', 2.3, 1, [136], 'survie'
          UNION ALL SELECT 1601, 1524, 'champion', 999, 'Inconnu', 'baisse', -5.0, 1, [999], 'degats'
      - input: ref('stg_ladder__participants')
        format: sql
        rows: |
          SELECT CONCAT('A21_', CAST(n AS STRING)) AS match_id, 1 AS participant_id,
            1621 AS patch_key, 266 AS champion_id, n <= 5 AS is_win
          FROM UNNEST(GENERATE_ARRAY(1, 10)) AS n
          UNION ALL
          SELECT CONCAT('A22_', CAST(n AS STRING)), 1, 1622, 266, n <= 6
          FROM UNNEST(GENERATE_ARRAY(1, 10)) AS n
          UNION ALL SELECT 'S21_1', 2, 1621, 136, TRUE
          UNION ALL SELECT 'S21_2', 2, 1621, 136, FALSE
          UNION ALL SELECT 'S22_1', 2, 1622, 136, TRUE
      - input: ref('int_ladder__completed_purchases')
        format: sql
        rows: |
          SELECT CONCAT('A22_', CAST(n AS STRING)) AS match_id, 1 AS participant_id,
            2501 AS item_id, 1 AS purchase_rank
          FROM UNNEST(GENERATE_ARRAY(1, 10)) AS n
          UNION ALL SELECT 'A21_1', 1, 2501, 4
    expect:
      rows:
        # value_kind recopie de la prediction (19/11/2026) : on peut juger les
        # predictions « survie » a part.
        - {subject_type: objet, subject_id: 2501, value_kind: degats, old_population: 10, old_hits: 0,
           new_population: 10, new_hits: 10, new_hit_wins: 6,
           share_verdict: confirme, win_verdict: sans_donnees}
        - {subject_type: champion, subject_id: 136, value_kind: survie, old_population: 12, old_hits: 2,
           new_population: 11, new_hits: 1, new_hit_wins: 1,
           share_verdict: sens_contraire, win_verdict: meme_sens}

