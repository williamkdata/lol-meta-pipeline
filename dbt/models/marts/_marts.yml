  # La fidelite des builds sur deux patches. Au 16.22, trois joueurs :
  #   p1 : Infinity Edge, Collector, Lord Dominik (rangs 1 a 3), tous dans
  #        l'inventaire final -> 3 trouves ;
  #   p2 : Manamune (rang 1), Black Cleaver (rang 2) ; l'inventaire contient
  #        Muramana -> Manamune compte comme transforme, Black Cleaver trouve ;
  #   p3 : Manamune (rang 1), Black Cleaver (rang 2), Bloodthirster (rang 4) ;
  #        ni Manamune ni Muramana dans l'inventaire (revendu) -> absent ;
  #        Bloodthirster, absent lui aussi, n'est PAS controle (rang 4).
  # 16.22 : 7 controles, 5 trouves, 1 transforme, 1 absent -> 6/7 = 0,8571.
  # 16.21 : un joueur, Infinity Edge trouve -> 1/1.
  - name: build_fidelity_counts_transformed_items_and_ignores_rank_four
    model: mart_ladder_build_fidelity
    given:
      - input: ref('int_ladder__completed_purchases')
        rows:
          - {match_id: "M1", participant_id: 1, item_id: 3031, purchase_rank: 1}
          - {match_id: "M1", participant_id: 1, item_id: 6676, purchase_rank: 2}
          - {match_id: "M1", participant_id: 1, item_id: 3036, purchase_rank: 3}
          - {match_id: "M1", participant_id: 2, item_id: 3004, purchase_rank: 1}
          - {match_id: "M1", participant_id: 2, item_id: 3071, purchase_rank: 2}
          - {match_id: "M1", participant_id: 3, item_id: 3004, purchase_rank: 1}
          - {match_id: "M1", participant_id: 3, item_id: 3071, purchase_rank: 2}
          - {match_id: "M1", participant_id: 3, item_id: 3072, purchase_rank: 4}
          - {match_id: "M2", participant_id: 1, item_id: 3031, purchase_rank: 1}
      - input: ref('stg_ladder__participants')
        format: sql
        rows: |
          SELECT 'M1' AS match_id, 1 AS participant_id, 1622 AS patch_key,
            [3031, 6676, 3036, 3006] AS item_ids
          UNION ALL SELECT 'M1', 2, 1622, [3042, 3071]
          UNION ALL SELECT 'M1', 3, 1622, [3071, 3047]
          UNION ALL SELECT 'M2', 1, 1621, [3031]
      - input: ref('item_transformations')
        rows:
          - {item_id: 3004, transformed_item_id: 3042}
      - input: ref('stg_ddragon__items')
        rows:
          - {patch_key: 1622, item_id: 3004, item_name: Manamune}
    expect:
      rows:
        - {patch_key: 1622, items_checked: 7, items_found: 5, items_transformed: 1,
           items_missing: 1, fidelity_rate: 0.8571, most_missing_items: "Manamune (1)"}
        - {patch_key: 1621, items_checked: 1, items_found: 1, items_transformed: 0,
           items_missing: 0, fidelity_rate: 1.0, most_missing_items: null}

