  # Version B du moteur theorique, calculee a la main. Prix des stats : AD 35,
  # PV 2,5, armure 20, AP 20, critique 4 000 (pour 100 %).
  # Utilite = la plus haute de : la classe principale ; la moitie de la classe
  # secondaire ; la part du ratio (ratio de la stat / plus gros ratio).
  #   Ambessa (Fighter, Assassin ; ratio AD 5,0) : AD max(0,5 ; 0 ; 1) = 1,
  #     PV 1, armure 0,5, critique 0, AP 0.
  #       Sterak  : 40 AD x 35 + 400 PV x 2,5 = 2 400 / 3 200 = 0,75   -> 1er
  #       IE      : 65 AD x 35 = 2 275 (critique inutile) / 3 450 = 0,6594
  #       Thorn   : 350 PV x 2,5 + 70 armure x 20 x 0,5 = 1 575 / 2 450 = 0,6429
  #       Rabadon : 0
  #   Usage des ratios (ligne KitRatios) : Fighter 1, Assassin 1, Tank 0,5,
  #     Mage 1 (en secondaire : 0,5).
  #   Malphite (Tank, Mage ; ratios AP 2,6, armure 0,55, PV 0,1) : usage des
  #     ratios max(0,5 ; 0,5 x 1) = 0,5 -> AP 1 x 0,5 = 0,5 ; armure 1, PV 1
  #     (classe Tank), AD 0, critique 0.
  #       Thorn   : 875 + 1 400 = 2 275 / 2 450 = 0,9286 -> 1er
  #       Rabadon : 130 AP x 20 x 0,5 = 1 300 / 3 600 = 0,3611
  #       Sterak  : 1 000 / 3 200 = 0,3125 ; IE : 0
  # Rentabilite brute (toutes stats, sans utilite) de l'IE : (2 275 + 1 000)
  # / 3 450 = 0,9493.
  # Au 16.21 (a part, pour ne pas toucher aux rangs du 16.22) : Ezreal
  # (Marksman, Mage), sans ratio, et un objet fictif d'acceleration (50 x 50 =
  # 2 500 / 2 500). Acceleration : Marksman 0,5 ; Mage 1 mais classe
  # secondaire -> 0,5 x 1 = 0,5. Utilite 0,5 -> rentabilite 0,5 (1,0 si la
  # classe secondaire comptait en entier).
  # La survie ne compte pas (19/11/2026) : une ligne survie d'Ambessa a 10 d'AP
  # ferait d'elle une acheteuse de Rabadon (AP 1) et diviserait par deux
  # l'utilite de son AD (5 / 10). Seule la valeur degats sert d'etalon.
