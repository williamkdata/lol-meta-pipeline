          - {patch_key: 1622, patch: '16.22', champion_id: 202, champion_code: Jhin, slot: P, spell_name: JhinP, calc_name: TotalADPercent, formula: '{"__type": "GameCalculation", "mDisplayAsPercent": true}'}
