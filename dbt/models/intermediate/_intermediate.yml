version: 2

models:
  - name: int_ladder__completed_purchases
    description: >
      L'ordre d'achat des objets termines de chaque joueur du ladder : une
      ligne par joueur et par objet, avec son rang (1 = premier objet termine).
      Achats annules dans la minute exclus ; un objet revendu puis rachete ne
      compte qu'une fois, a son premier achat. Partage par mart_ladder_builds
      et les familles de builds.
    columns:
      - name: purchase_rank
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, participant_id, item_id]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, participant_id, purchase_rank]

  - name: int_ladder__build_families
    description: >
      La famille du build de chaque joueur du ladder qui a au moins un objet
      termine, d'apres les familles principales (seed item_families) de ses 3
      premiers objets termines, ou de ceux qu'il a si la partie s'est finie
      avant. Regles, dans l'ordre : majorite (au moins 2 objets de la meme
      famille), hybride (familles AD et AP melangees), sinon la famille du
      premier objet. classification_rule dit laquelle a joue.
    columns:
      - name: build_family
        data_tests: [not_null]
      - name: classification_rule
        data_tests:
          - accepted_values:
              arguments:
                values: [majorite, hybride, premier_objet]
      - name: items_counted
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 3
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, participant_id]

  - name: int_items__stat_gold_price
    description: >
      Le prix en or d'un point de chaque stat, par patch (methode de la
      rentabilite en or) : l'objet de base le moins cher qui ne donne que
      cette stat. Au 16.22 : AD 35 (Long Sword), AP 20 (Amplifying Tome),
      PV 2,67 (Ruby Crystal), armure 20 (Cloth Armor), resistance magique 20
      (Null-Magic Mantle), acceleration 50 (Glowing Mote), vitesse d'attaque
      25 le % (Dagger), critique 40 le % (Cloak of Agility). Les stats sans
      objet de base n'ont pas de prix (non valorisees).
    columns:
      - name: gold_per_unit
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, stat]

  - name: int_champions__base_stats
    description: >
      Les stats de base de chaque champion : une ligne par patch et par
      champion, une colonne par stat (fiche du fichier du jeu, traduite en
      staging). Un champ absent prend la valeur par defaut du jeu, pas
      toujours 0 : hp_regen_base 1 PV par seconde, resource_base 100, gains
      par niveau 0, resource_type "aucune". Unites : regenerations PAR
      SECONDE ; as_per_level en pourcentage (2.5 = +2,5 % par niveau) ;
      as_ratio = la vitesse d'attaque qui sert de base aux bonus (0 pour
      Jhin). resource_type : mana, energie, aucune, ou autre (fureur,
      chaleur, rage...) ; le code reste dans resource_type_code.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id]
    columns:
      # Stats SANS valeur par defaut : presentes pour les 3 794 champions x
      # patches (mesure du 09/11/2026). Si l'une manque, c'est sans doute un
      # nouveau renommage de Riot : le test echoue.
      - name: hp_base
        data_tests: [not_null]
      - name: hp_per_level
        data_tests: [not_null]
      - name: armor_base
        data_tests: [not_null]
      - name: mr_base
        data_tests: [not_null]
      - name: mr_per_level
        data_tests: [not_null]
      - name: ad_base
        data_tests: [not_null]
      - name: as_base
        data_tests: [not_null]
      - name: as_ratio
        data_tests: [not_null]
      - name: attack_range
        data_tests: [not_null]
      - name: move_speed
        data_tests: [not_null]
      - name: crit_damage
        data_tests: [not_null]
      - name: resource_regen_base
        data_tests: [not_null]
      - name: resource_type
        data_tests:
          - accepted_values:
              arguments:
                values: [mana, energie, aucune, autre]

  - name: int_champions__stats_by_level
    description: >
      Les stats "nues" de chaque champion (sans objets, runes ni passifs) a
      chaque niveau, de 1 a champion_max_level (20). Une ligne par patch,
      champion et niveau. Croissance non lineaire (macro level_growth),
      verifiee sur les vraies stats des parties. as_bonus_pct = bonus de
      vitesse d'attaque gagne par les niveaux, en % ; attack_speed = vitesse
      d'attaque totale (le bonus est multiplie par as_ratio). Regenerations
      par seconde.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, level]
    columns:
      - name: level
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: "{{ var('champion_max_level') }}"
      - name: hp
        data_tests: [not_null]
      - name: hp_regen
        data_tests: [not_null]
      - name: armor
        data_tests: [not_null]
      - name: mr
        data_tests: [not_null]
      - name: ad
        data_tests: [not_null]
      - name: attack_speed
        data_tests: [not_null]
      - name: resource
        data_tests: [not_null]
      - name: resource_regen
        data_tests: [not_null]

  - name: int_kit__damage_formulas
    description: >
      Les formules de sorts qui sont des DEGATS, avec leur type (physical,
      magic, true), d'apres la balise de l'infobulle qui les cite. Une ligne
      par patch, champion, touche, formule et type : une formule peut en avoir
      deux (Ahri Q : magique a l'aller, brut au retour).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [patch_key, champion_id, slot, calc_name, damage_type]
    columns:
      - name: damage_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                # 'true' entre guillemets : sans eux, YAML lit le booleen vrai.
                values: [physical, magic, 'true']
      - name: scales_with
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [flat, target_max_hp, target_missing_hp, target_current_hp, other]

unit_tests:
  # L'ordre du build et l'achat annule : Jinx achete la Lame d'infini (3031),
  # l'annule 10 s plus tard, achete Collector (6676), puis rachete la Lame.
  # L'ordre doit etre Collector (1) puis Lame (2) ; l'Epee B. F. (1038), un
  # composant, n'est pas un objet termine. (Ce test vivait dans
  # mart_ladder_builds avant que la logique soit partagee, le 06/11/2026.)
  - name: purchase_order_ignores_an_undone_purchase
    model: int_ladder__completed_purchases
    given:
      - input: ref('stg_ladder__participants')
        rows:
          - {match_id: "EUW1_1", participant_id: 4, patch_key: 1621}
      - input: ref('stg_ddragon__items')
        rows:
          - {patch_key: 1621, item_id: 3031, is_completed: true}
          - {patch_key: 1621, item_id: 6676, is_completed: true}
          - {patch_key: 1621, item_id: 1038, is_completed: false}
      - input: ref('stg_ladder__events')
        rows:
          - {match_id: "EUW1_1", participant_id: 4, event_type: ITEM_PURCHASED,
             item_id: 1038, before_item_id: null, timestamp_ms: 400000}
          - {match_id: "EUW1_1", participant_id: 4, event_type: ITEM_PURCHASED,
             item_id: 3031, before_item_id: null, timestamp_ms: 600000}
          - {match_id: "EUW1_1", participant_id: 4, event_type: ITEM_UNDO,
             item_id: null, before_item_id: 3031, timestamp_ms: 610000}
          - {match_id: "EUW1_1", participant_id: 4, event_type: ITEM_PURCHASED,
             item_id: 6676, before_item_id: null, timestamp_ms: 900000}
          - {match_id: "EUW1_1", participant_id: 4, event_type: ITEM_PURCHASED,
             item_id: 3031, before_item_id: null, timestamp_ms: 1300000}
    expect:
      rows:
        - {match_id: "EUW1_1", participant_id: 4, item_id: 6676, purchase_rank: 1}
        - {match_id: "EUW1_1", participant_id: 4, item_id: 3031, purchase_rank: 2}

  # Les trois regles du vote, sur six joueurs :
  #   1 Jinx   Lame d'infini, Collector, Tueur de krakens -> critique (majorite)
  #   2 Varus  Lame du roi dechu, Guinsoo, Nashor          -> on_hit (majorite)
  #   3 Kai'Sa Tueur de krakens, Nashor, Lame d'infini     -> hybride (AD + AP)
  #   4 Talon  Youmuu, Lame d'infini, Tueur de krakens     -> letalite (premier
  #            objet : pas de majorite, tout du cote AD)
  #   5 Ahri   Coiffe de Rabadon seule (partie courte)     -> ap (premier objet)
  #   6 Ahri   un objet absent de la seed                  -> sans_famille, visible
  #            au lieu d'etre perdu (le test de couverture previent aussi)
  #   7 Talon  comme 4, plus Collector en 4e position     -> letalite : seuls les
  #            3 premiers objets votent (avec le 4e, critique aurait la majorite)
  #   8 Ezreal Force de la trinite, Manamune, Faim insatiable -> combattant
  #            (majorite). Une regle "objet signature" (Manamune -> AD mana) a
  #            ete essayee puis retiree le 06/11/2026 (decision de William) : elle
  #            reclassait aussi les builds letalite avec Manamune (Jayce, Varus).
  - name: build_family_majority_hybrid_and_first_item
    model: int_ladder__build_families
    given:
      - input: ref('stg_ladder__participants')
        rows:
          - {match_id: "M1", participant_id: 1, patch_key: 1622, team_position: BOTTOM, champion_id: 222, is_win: true}
          - {match_id: "M1", participant_id: 2, patch_key: 1622, team_position: BOTTOM, champion_id: 110, is_win: true}
          - {match_id: "M1", participant_id: 3, patch_key: 1622, team_position: BOTTOM, champion_id: 145, is_win: false}
          - {match_id: "M1", participant_id: 4, patch_key: 1622, team_position: MIDDLE, champion_id: 91, is_win: false}
          - {match_id: "M1", participant_id: 5, patch_key: 1622, team_position: MIDDLE, champion_id: 103, is_win: true}
          - {match_id: "M1", participant_id: 6, patch_key: 1622, team_position: MIDDLE, champion_id: 103, is_win: false}
          - {match_id: "M1", participant_id: 7, patch_key: 1622, team_position: MIDDLE, champion_id: 91, is_win: true}
          - {match_id: "M1", participant_id: 8, patch_key: 1622, team_position: BOTTOM, champion_id: 81, is_win: true}
      - input: ref('int_ladder__completed_purchases')
        rows:
          - {match_id: "M1", participant_id: 1, item_id: 3031, purchase_rank: 1}
          - {match_id: "M1", participant_id: 1, item_id: 6676, purchase_rank: 2}
          - {match_id: "M1", participant_id: 1, item_id: 6672, purchase_rank: 3}
          - {match_id: "M1", participant_id: 2, item_id: 3153, purchase_rank: 1}
          - {match_id: "M1", participant_id: 2, item_id: 3124, purchase_rank: 2}
          - {match_id: "M1", participant_id: 2, item_id: 3115, purchase_rank: 3}
          - {match_id: "M1", participant_id: 3, item_id: 6672, purchase_rank: 1}
          - {match_id: "M1", participant_id: 3, item_id: 3115, purchase_rank: 2}
          - {match_id: "M1", participant_id: 3, item_id: 3031, purchase_rank: 3}
          - {match_id: "M1", participant_id: 4, item_id: 3142, purchase_rank: 1}
          - {match_id: "M1", participant_id: 4, item_id: 3031, purchase_rank: 2}
          - {match_id: "M1", participant_id: 4, item_id: 6672, purchase_rank: 3}
          - {match_id: "M1", participant_id: 5, item_id: 3089, purchase_rank: 1}
          - {match_id: "M1", participant_id: 6, item_id: 9999, purchase_rank: 1}
          - {match_id: "M1", participant_id: 7, item_id: 3142, purchase_rank: 1}
          - {match_id: "M1", participant_id: 7, item_id: 3031, purchase_rank: 2}
          - {match_id: "M1", participant_id: 7, item_id: 6672, purchase_rank: 3}
          - {match_id: "M1", participant_id: 7, item_id: 6676, purchase_rank: 4}
          - {match_id: "M1", participant_id: 8, item_id: 3078, purchase_rank: 1}
          - {match_id: "M1", participant_id: 8, item_id: 3004, purchase_rank: 2}
          - {match_id: "M1", participant_id: 8, item_id: 2517, purchase_rank: 3}
      - input: ref('item_families')
        rows:
          - {item_id: 3031, family: critique}
          - {item_id: 6676, family: critique}
          - {item_id: 6672, family: on_hit}
          - {item_id: 3153, family: on_hit}
          - {item_id: 3124, family: on_hit}
          - {item_id: 3115, family: ap}
          - {item_id: 3142, family: letalite}
          - {item_id: 3089, family: ap}
          - {item_id: 3078, family: combattant}
          - {item_id: 3004, family: ad_mana}
          - {item_id: 2517, family: combattant}
    expect:
      rows:
        - {participant_id: 1, build_family: critique, classification_rule: majorite, items_counted: 3}
        - {participant_id: 2, build_family: on_hit, classification_rule: majorite, items_counted: 3}
        - {participant_id: 3, build_family: hybride, classification_rule: hybride, items_counted: 3}
        - {participant_id: 4, build_family: letalite, classification_rule: premier_objet, items_counted: 3}
        - {participant_id: 5, build_family: ap, classification_rule: premier_objet, items_counted: 1}
        - {participant_id: 6, build_family: sans_famille, classification_rule: premier_objet, items_counted: 1}
        - {participant_id: 7, build_family: letalite, classification_rule: premier_objet, items_counted: 3}
        - {participant_id: 8, build_family: combattant, classification_rule: majorite, items_counted: 3}

  # Le prix en or d'une stat = l'objet de base le moins cher qui ne donne que
  # cette stat. Au 16.22 :
  #   AD : Long Sword 350 or / 10 -> 35 ; Cull (450 / 7) et B. F. Sword
  #        (1 300 / 40) sont plus chers : pas la reference ;
  #   PV : Ruby Crystal 400 / 150 -> 2,6667 ;
  #   Vitesse d'attaque : Dagger 250 / 0,10 -> 2 500 (par 100 %) ;
  #   ecartes : Doran's Blade (deux stats) ; un objet FABRIQUE fictif a
  #   partir d'un Ruby, 350 or pour 200 PV (1,75 le PV) : moins cher que le
  #   Ruby, il serait choisi si le filtre « objet de base » manquait (trou
  #   trouve par le sabotage du 09/11) ; une variante d'un autre mode
  #   (identifiant a 6 chiffres) ; un objet invendable. Dagger a 0,1 stocke
  #   0,10000000149 : la valeur est arrondie avant la division.
  - name: stat_gold_price_uses_the_cheapest_single_stat_basic_item
    model: int_items__stat_gold_price
    given:
      - input: ref('stg_ddragon__items')
        format: sql
        rows: |
          SELECT 1622 AS patch_key, 1036 AS item_id, 'Long Sword' AS item_name, 350 AS gold_total,
            TRUE AS purchasable, TRUE AS on_summoners_rift, CAST([] AS ARRAY<INT64>) AS builds_from
          UNION ALL SELECT 1622, 1083, 'Cull', 450, TRUE, TRUE, CAST([] AS ARRAY<INT64>)
          UNION ALL SELECT 1622, 1038, 'B. F. Sword', 1300, TRUE, TRUE, CAST([] AS ARRAY<INT64>)
          UNION ALL SELECT 1622, 1028, 'Ruby Crystal', 400, TRUE, TRUE, CAST([] AS ARRAY<INT64>)
          UNION ALL SELECT 1622, 1042, 'Dagger', 250, TRUE, TRUE, CAST([] AS ARRAY<INT64>)
          UNION ALL SELECT 1622, 1055, "Doran's Blade", 450, TRUE, TRUE, CAST([] AS ARRAY<INT64>)
          UNION ALL SELECT 1622, 9001, 'Objet fabrique (fictif)', 350, TRUE, TRUE, [1028]
          UNION ALL SELECT 1622, 221036, 'Long Sword', 100, TRUE, TRUE, CAST([] AS ARRAY<INT64>)
          UNION ALL SELECT 1622, 9999, 'Invendable', 100, FALSE, TRUE, CAST([] AS ARRAY<INT64>)
      - input: ref('stg_item_stats')
        rows:
          - {patch_key: 1622, item_id: 1036, stat: FlatPhysicalDamageMod, value: 10.0}
          - {patch_key: 1622, item_id: 1083, stat: FlatPhysicalDamageMod, value: 7.0}
          - {patch_key: 1622, item_id: 1038, stat: FlatPhysicalDamageMod, value: 40.0}
          - {patch_key: 1622, item_id: 1028, stat: FlatHPPoolMod, value: 150.0}
          - {patch_key: 1622, item_id: 1042, stat: PercentAttackSpeedMod, value: 0.10000000149011612}
          - {patch_key: 1622, item_id: 1055, stat: FlatPhysicalDamageMod, value: 10.0}
          - {patch_key: 1622, item_id: 1055, stat: FlatHPPoolMod, value: 80.0}
          - {patch_key: 1622, item_id: 9001, stat: FlatHPPoolMod, value: 200.0}
          - {patch_key: 1622, item_id: 221036, stat: FlatPhysicalDamageMod, value: 10.0}
          - {patch_key: 1622, item_id: 9999, stat: FlatPhysicalDamageMod, value: 10.0}
    expect:
      rows:
        - {patch_key: 1622, stat: FlatPhysicalDamageMod, reference_item_name: Long Sword, gold_per_unit: 35.0}
        - {patch_key: 1622, stat: FlatHPPoolMod, reference_item_name: Ruby Crystal, gold_per_unit: 2.6667}
        - {patch_key: 1622, stat: PercentAttackSpeedMod, reference_item_name: Dagger, gold_per_unit: 2500.0}
  # Un champ absent du fichier du jeu prend la valeur par defaut du JEU, pas
  # toujours 0 : 1 PV par seconde de regeneration (Zac), 100 de ressource
  # (Tryndamere), 0 pour un gain par niveau (Jhin : vitesse d'attaque), aucune
  # ressource (Zac). Une valeur PRESENTE, meme a 0, n'est jamais remplacee
  # (la ressource de base de Zac, le ratio de vitesse d'attaque de Jhin). Les
  # nombres du fichier sont arrondis (4.400000095... -> 4.4). Valeurs reelles
  # du 16.22.
  - name: base_stats_fill_game_defaults_not_zero
    model: int_champions__base_stats
    given:
      - input: ref('stg_kit__champion_record')
        rows:
          - {patch_key: 1622, patch: '16.22', champion_id: 154, champion_code: Zac, stat: hp_regen_per_level, value: 0.10000000149011612}
          - {patch_key: 1622, patch: '16.22', champion_id: 154, champion_code: Zac, stat: resource_base, value: 0.0}
          - {patch_key: 1622, patch: '16.22', champion_id: 23, champion_code: Tryndamere, stat: hp_regen_base, value: 1.7000000476837158}
          - {patch_key: 1622, patch: '16.22', champion_id: 23, champion_code: Tryndamere, stat: resource_type_code, value: 4.0}
          - {patch_key: 1622, patch: '16.22', champion_id: 202, champion_code: Jhin, stat: hp_regen_base, value: 0.75}
          - {patch_key: 1622, patch: '16.22', champion_id: 202, champion_code: Jhin, stat: ad_per_level, value: 4.400000095367432}
          - {patch_key: 1622, patch: '16.22', champion_id: 202, champion_code: Jhin, stat: as_ratio, value: 0.0}
          - {patch_key: 1622, patch: '16.22', champion_id: 202, champion_code: Jhin, stat: resource_base, value: 300.0}
          - {patch_key: 1622, patch: '16.22', champion_id: 202, champion_code: Jhin, stat: resource_per_level, value: 50.0}
          - {patch_key: 1622, patch: '16.22', champion_id: 202, champion_code: Jhin, stat: resource_type_code, value: 0.0}
    expect:
      rows:
        - {patch_key: 1622, champion_code: Zac, hp_regen_base: 1.0, hp_regen_per_level: 0.1, ad_per_level: 0.0, as_per_level: 0.0, as_ratio: null, resource_base: 0.0, resource_per_level: 0.0, resource_type_code: null, resource_type: aucune}
        - {patch_key: 1622, champion_code: Tryndamere, hp_regen_base: 1.7, hp_regen_per_level: 0.0, ad_per_level: 0.0, as_per_level: 0.0, as_ratio: null, resource_base: 100.0, resource_per_level: 0.0, resource_type_code: 4, resource_type: autre}
        - {patch_key: 1622, champion_code: Jhin, hp_regen_base: 0.75, hp_regen_per_level: 0.0, ad_per_level: 4.4, as_per_level: 0.0, as_ratio: 0.0, resource_base: 300.0, resource_per_level: 50.0, resource_type_code: 0, resource_type: mana}
  # Les stats d'Ahri (16.22, valeurs reelles) aux niveaux 1 a 3 (le niveau
  # maximum est ramene a 3 pour le test). Valeurs calculees a la main avec la
  # courbe de LoL : niveau 2 = 0,72 gain ; niveau 3 = 1,475 gain (une ligne
  # droite donnerait 1 et 2 : 694 et 798 PV au lieu de 664,88 et 743,4). La
  # vitesse d'attaque grandit avec le RATIO (0,625), pas avec la base (0,668).
  - name: stats_by_level_follow_the_lol_growth_curve
    model: int_champions__stats_by_level
    overrides:
      vars:
        champion_max_level: 3
    given:
      - input: ref('int_champions__base_stats')
        rows:
          - {patch_key: 1622, patch: '16.22', champion_id: 103, champion_code: Ahri, hp_base: 590.0, hp_per_level: 104.0, hp_regen_base: 0.5, hp_regen_per_level: 0.12, armor_base: 21.0, armor_per_level: 4.2, mr_base: 30.0, mr_per_level: 1.3, ad_base: 53.0, ad_per_level: 3.0, as_base: 0.668, as_per_level: 2.2, as_ratio: 0.625, attack_range: 550.0, crit_damage: 2.0, move_speed: 330.0, resource_base: 418.0, resource_per_level: 25.0, resource_regen_base: 1.6, resource_regen_per_level: 0.16, resource_type: mana}
    expect:
      rows:
        - {champion_code: Ahri, level: 1, hp: 590.0, armor: 21.0, attack_speed: 0.668, as_bonus_pct: 0.0, resource: 418.0}
        - {champion_code: Ahri, level: 2, hp: 664.88, armor: 24.024, attack_speed: 0.6779, as_bonus_pct: 1.584, resource: 436.0}
        - {champion_code: Ahri, level: 3, hp: 743.4, armor: 27.195, attack_speed: 0.6883, as_bonus_pct: 3.245, resource: 454.875}
  # Les formules de degats et leur type, d'apres les vraies infobulles du
  # 16.22 (Ahri) et du 16.21 (Ambessa W). Ahri Q : une formule, deux types.
  # Ecartes : le bouclier d'Ambessa (shield), la vitesse d'Ahri (speed), une
  # formule jamais citee, un nombre de l'infobulle qui n'est pas une formule,
  # et une ligne d'infobulle d'un autre patch. Les noms de formules ont des
