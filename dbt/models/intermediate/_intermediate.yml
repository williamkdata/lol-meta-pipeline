        rows:
          - {patch_key: 1622, patch: '16.22', champion_id: 103, champion_code: Ahri, slot: Q, spell_name: AhriQ, calc_name: TotalDamage}
          - {patch_key: 1622, patch: '16.22', champion_id: 103, champion_code: Ahri, slot: W, spell_name: AhriW, calc_name: SingleFireDamage}
          - {patch_key: 1622, patch: '16.22', champion_id: 103, champion_code: Ahri, slot: W, spell_name: AhriW, calc_name: MultiFireDamage}
