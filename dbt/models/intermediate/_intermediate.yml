          - {patch_key: 1622, champion_id: 103, slot: W, spell_name: AhriW, name: singlefiredamage, tag: magicDamage}
          - {patch_key: 1622, champion_id: 103, slot: W, spell_name: AhriW, name: multifiredamage, tag: magicDamage}
