          - {patch_key: 1622, patch: '16.22', champion_id: 799, champion_code: Ambessa, slot: W, spell_name: AmbessaW, calc_name: Calc_Jamais_Citee}
          # Des formules en pourcentage (mDisplayAsPercent) : de quoi ?
