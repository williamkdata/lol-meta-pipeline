version: 2

# Les kits des champions (formules des sorts), depuis CommunityDragon.
# Jade_ ecartes ; le doublon de Rek'Sai (dans le fichier du jeu) dedoublonne.

models:
  - name: stg_kit__formulas
    description: Une formule de sort entiere (JSON canonique) par patch, champion et touche.
    columns:
      - name: patch_key
        data_tests: [not_null]
      - name: slot
        data_tests:
          - accepted_values:
              arguments:
                values: [Q, W, E, R, P]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, slot, calc_name]

  - name: stg_kit__parts
    description: Un morceau de formule par patch, champion, touche, formule et position.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, slot, calc_name, part_path]

  - name: stg_kit__values
    description: Une valeur par rang par patch, champion, touche, sort, nom et rang.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [patch_key, champion_id, slot, spell_name, value_name, spell_rank]

  - name: stg_ddragon__spells
    description: Temps de recharge et cout par champion, touche et rang (Data Dragon).
    columns:
      - name: max_rank
        data_tests: [not_null]
      - name: slot
        data_tests:
          - accepted_values:
              arguments:
                values: [Q, W, E, R]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, slot, spell_rank]

  - name: stg_item_stats
    description: Une stat par patch, objet et nom de stat (fichiers du jeu).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, item_id, stat]

  - name: stg_kit__champion_record
    description: >
      La fiche du champion (fichier du jeu) : une stat par patch, champion et
      stat, sous un nom stable (seed champion_record_fields). source_field garde
      le nom lu dans le fichier. Unites du fichier du jeu : regenerations PAR
      SECONDE (Data Dragon : par 5 secondes) ; as_per_level en pourcentage
      (2.5 = +2,5 % par niveau) ; as_ratio = la vitesse d'attaque qui sert de
      base aux bonus (en general egale a as_base).
    data_tests:
      # Jamais deux orthographes d'un meme champ en meme temps pour un champion :
      # sinon, laquelle croire ? (0 cas sur 22 patches, mesure du 09/11/2026.)
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, stat]

  - name: stg_kit__spell_tooltips
    description: >
      Les nombres des infobulles des sorts, chacun avec la balise la plus
      proche : type de degats (physicalDamage, magicDamage, trueDamage),
      bouclier (shield), soin (healing)... tag vide hors de toute balise.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patch_key, champion_id, slot, name, tag]

unit_tests:
  # Le meme chiffre sous trois orthographes (ancien nom, nouveau nom, nom
  # hache) devient la meme stat. Un champ hors de la seed (selectionHeight :
  # la hauteur de la zone cliquable) est ignore ; l'entree speciale Jade_ du
  # 16.15 est ecartee. Valeurs reelles d'Ahri.
  - name: champion_record_translates_every_known_spelling
    model: stg_kit__champion_record
    given:
      - input: source('lol_raw', 'kit_champion_record')
        rows:
          - {patch: '16.4', champion_id: 103, champion_code: Ahri, field: baseHP, value: 590.0}
          - {patch: '16.22', champion_id: 103, champion_code: Ahri, field: baseHPModifiable, value: 590.0}
          - {patch: '16.10', champion_id: 103, champion_code: Ahri, field: '{01262a25}', value: 2.05}
          - {patch: '16.22', champion_id: 103, champion_code: Ahri, field: 'primaryAbilityResource.{726ee5cd}', value: 418.0}
          - {patch: '16.22', champion_id: 103, champion_code: Ahri, field: selectionHeight, value: 180.0}
          - {patch: '16.15', champion_id: 60103, champion_code: Jade_Ahri, field: baseHPModifiable, value: 590.0}
      - input: ref('champion_record_fields')
        rows:
          - {field: baseHP, stat: hp_base, statut: observe, note: '16.1-16.4'}
          - {field: baseHPModifiable, stat: hp_base, statut: observe, note: '16.5-16.22'}
          - {field: '{01262a25}', stat: mr_per_level, statut: observe, note: '16.5-16.15'}
          - {field: 'primaryAbilityResource.{726ee5cd}', stat: resource_base, statut: observe, note: '16.5-16.22'}
    expect:
      rows:
        - {patch_key: 1604, champion_id: 103, stat: hp_base, value: 590.0, source_field: baseHP}
        - {patch_key: 1622, champion_id: 103, stat: hp_base, value: 590.0, source_field: baseHPModifiable}
        - {patch_key: 1610, champion_id: 103, stat: mr_per_level, value: 2.05, source_field: '{01262a25}'}
        - {patch_key: 1622, champion_id: 103, stat: resource_base, value: 418.0, source_field: 'primaryAbilityResource.{726ee5cd}'}

  # L'apercu du PBE (18/11/2026, macro source_avec_apercu_pbe). Valeurs
  # reelles d'Akshan : Q, ratio d'AD 0,70 au 16.23, 0,80 au PBE du 16.24.
  - name: values_add_the_pbe_preview_as_an_ordinary_patch
    model: stg_kit__values
    overrides:
      vars: {pbe_preview: true}
    given:
      - input: source('lol_raw', 'kit_data_values')
        rows:
          - {patch: '16.23', champion_id: 166, champion_code: Akshan, slot: Q, spell_name: AkshanQ, value_name: ADRatio, spell_rank: 1, value: 0.7}
      - input: source('lol_raw', 'pbe_kit_data_values')
        rows:
          - {patch: '16.24', champion_id: 166, champion_code: Akshan, slot: Q, spell_name: AkshanQ, value_name: ADRatio, spell_rank: 1, value: 0.8}
    expect:
      rows:
        - {patch_key: 1623, value: 0.7}
        - {patch_key: 1624, value: 0.8}

  # Le vrai 16.24 est sorti (0,80) ; un vieil apercu (0,75) traine encore dans
  # la table du PBE : le vrai patch gagne, l'apercu est ignore.
  - name: values_ignore_the_preview_once_the_real_patch_is_out
    model: stg_kit__values
    overrides:
      vars: {pbe_preview: true}
    given:
      - input: source('lol_raw', 'kit_data_values')
        rows:
          - {patch: '16.23', champion_id: 166, champion_code: Akshan, slot: Q, spell_name: AkshanQ, value_name: ADRatio, spell_rank: 1, value: 0.7}
          - {patch: '16.24', champion_id: 166, champion_code: Akshan, slot: Q, spell_name: AkshanQ, value_name: ADRatio, spell_rank: 1, value: 0.8}
      - input: source('lol_raw', 'pbe_kit_data_values')
        rows:
          - {patch: '16.24', champion_id: 166, champion_code: Akshan, slot: Q, spell_name: AkshanQ, value_name: ADRatio, spell_rank: 1, value: 0.75}
    expect:
      rows:
        - {patch_key: 1623, value: 0.7}
        - {patch_key: 1624, value: 0.8}

  # Hors mode apercu (dev, prod, run quotidien) : la vraie table seule. Aucune
  # entree pour la table du PBE : si la macro y touchait, dbt la reclamerait.
  - name: values_read_only_the_real_table_outside_preview_mode
    model: stg_kit__values
    # Fixe explicitement : sinon, avec la cible pbe, le mode apercu s'allume
    # tout seul et le test ne testerait plus le mode normal.
    overrides:
      vars: {pbe_preview: false}
    given:
      - input: source('lol_raw', 'kit_data_values')
        rows:
          - {patch: '16.23', champion_id: 166, champion_code: Akshan, slot: Q, spell_name: AkshanQ, value_name: ADRatio, spell_rank: 1, value: 0.7}
    expect:
      rows:
        - {patch_key: 1623, value: 0.7}
