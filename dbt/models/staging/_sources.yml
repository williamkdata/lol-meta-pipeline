version: 2

sources:
  - name: lol_raw
    description: >
      Brut permanent, charge par les scripts de ingestion/. Fidele a la source :
      aucune correction ici, tout se fait dans le staging.
    tables:
      - name: ddragon_champions
        description: >
          Un champion par patch de la saison, depuis champion.json (en_US).
          Ajout a chaque chargement : un patch peut apparaitre plusieurs fois.
          Contient les 60 entrees speciales Jade_ du patch 16.15.

      - name: oe_matches
        description: >
          Le fichier de la saison d'Oracle's Elixir, remplace a chaque chargement.
          12 lignes par match (10 joueurs + 2 lignes equipe), 165 colonnes, TOUTES
          en texte. Le patch y est ecrit sur deux chiffres : 16.01.

      - name: ddragon_items
        description: >
          Un objet par patch de la saison, depuis item.json (en_US), variantes
          Arena comprises. Ajout a chaque chargement de patch.

      - name: ddragon_runes
        description: >
          Une rune par patch de la saison, depuis runesReforged.json (en_US),
          avec son arbre et sa rangee (0 = runes principales).

      - name: ddragon_spells
        description: >
          Temps de recharge et cout de chaque sort, par champion, touche et rang
          (jusqu'au rang max), depuis championFull.json. Source officielle, a
          jour (verifie contre les notes du 26.22). Contient les Jade_ du 16.15.

      - name: item_stats
        description: >
          Les stats de chaque objet, par patch, depuis les fichiers du jeu
          (CommunityDragon, items.cdtb.bin.json) : plus complet que Data Dragon
          (acceleration de competence), identique la ou les deux se recoupent.

      - name: kit_formulas
        description: >
          Une formule de sort par patch, champion et touche (Q, W, E, R, P),
          arbre entier en JSON canonique. Source : CommunityDragon (fichiers du
          jeu, non officiel). Chargee EN DERNIER : un patch present ici est
          complet. Contient les 60 entrees Jade_ du 16.15.

      - name: kit_formula_parts
        description: >
          Un morceau de formule par ligne : code de stat (0 = AP, 2 = AD...),
          code de formule (0 = total, 2 = bonus), coefficient, valeur par rang
          nommee, nombre fixe, valeurs selon le niveau.

      - name: kit_data_values
        description: >
          Les valeurs par rang des sorts (rangs 1 a 6). Le Q de Rek'Sai contient
          deux fois BuffDuration dans le fichier du jeu.

  - name: lol_raw_ladder
    description: >
      Ladder EUW (Challenger + Grandmaster, classee solo), charge chaque jour par
      ingestion/ladder.py. Trois tables partitionnees par jour sur game_start,
      partitions expirees apres 60 jours. Aucun identifiant de joueur.
      Le brut accepte les doublons (un lot recharge apres une panne) : le
      staging les retire.
    tables:
      - name: participants
        description: >
          Une ligne par joueur et par partie. Chargee EN DERNIER par le
          collecteur : une partie presente ici a ses timelines en base.
      - name: timeline_frames
        description: Une photo par joueur et par minute (or, XP, niveau, sbires).
      - name: timeline_events
        description: >
          Les evenements utiles (achats, sorts, kills, objectifs, tourelles),
          numerotes par leur rang dans toute la timeline (event_index).
